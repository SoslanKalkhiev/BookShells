<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookShells</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="information">
            <a href="" class="back">Назад, на главную</a>
            <a href="">Профиль</a>
            <button class="library">Библиотека</button>
        </div>
    </header>

    <div class="library-header">
        <p>Добавить коллекцию</p>
        <button class="add-collection">+</button>
        <h1>Моя библиотека</h1>
        <h4>Управляйте своей коллекцией книг</h4>
    </div>
    
    <div class="collections">
        <div> <p class="reading-cnt">0</p> <button class="reading">Читаю сейчас</button></div>
        <div> <p class="read-cnt">0</p> <button class="read">Прочитанные</button> </div>
        <div> <p class="wanna-read-cnt">0</p> <button class="wanna-read">Хочу прочитать</button></div>
        <div> <p class="recent-cnt">0</p> <button class="recent">Надавно просмотренные</button></div>
    </div>

    <h2>Мои коллекции</h2>
    <div class="collections">
        <div><p class="collection-1">1</p> <button class="recent">Поэзия</button> </div>
    </div>
    
</body>
</html>
