<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookShells</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-collection">
        <div class="inf-collection">
            <a href="" class="back">Назад, к библиотеке</a>
            <a href="">Профиль</a>
        </div>

        <div class="about-collection">
            <p>Читаю сейчас (1)</p>
            <!-- <p class="reading-cnt"></p> -->
            <button class="clear">Очистить коллекцию</button>
        </div>
    </header>
    
    <section class="chose-collection">
        <div class="book1">
            <img class="book" src="images/Mziry.png">
            <div class="book-desc">
                <p class="name">Мцыри</p>
                <p class="author">М.Ю. Лермонтов</p>
                <p class="begin">Начато</p>
                <p class="end">Завершено</p>

                <div class="genre-rating">
                    <label class="genre">Поэзия</label>
                    <div class="rating">Ваша оценка</div>
                </div>
                
            </div>
        </div>
        
    </section>
</body>
</html>
